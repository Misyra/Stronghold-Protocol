location = /data/resource-manifest.json {
    # Public offline-preload bootstrap. The service worker fetches this without the
    # page's gate cookie (and with a different UA), so the gate must not 444 it.
    auth_request off;
    if ($request_method !~ ^(GET|HEAD)$) { return 444; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SP-Drop-Rejections 1;
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_read_timeout 20s;
}

