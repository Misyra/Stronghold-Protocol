# Install as /etc/fail2ban/jail.d/sp-hardening.local AFTER choosing the ingress mode.
# Disabled by default: a kernel ban of a CF-reported visitor IP does not block CF packets.
[sp-hardening-direct]
enabled = false
filter = sp-hardening
backend = auto
logpath = /var/log/nginx/sp/stronghold.access.log
usedns = no
port = http,https
findtime = 60
maxretry = 451
bantime = -1
banaction = nftables-multiport[blocktype=drop]
ignoreip = 127.0.0.0/8 ::1

# The 101st refused /ws upgrade in 60 seconds bans for one hour; 100 never counts.
# Install sp-ws-upgrade.filter.conf and the updated sp_game log format before enabling.
[sp-ws-upgrade-direct]
enabled = false
filter = sp-ws-upgrade
backend = auto
logpath = /var/log/nginx/sp/stronghold.access.log
usedns = no
port = http,https
findtime = 60
maxretry = 100
bantime = 3600
bantime.increment = false
bantime.rndtime = 0
banaction = nftables-multiport[blocktype=drop]
ignoreip = 127.0.0.0/8 ::1

# Do not add nginx-limit-req again with a lower maxretry: that would silently override
# the chosen ban policy. If an existing file-based jail is reused, set backend=auto there too.
# Count all business responses, including cache HITs and 444 refusals, across paths.
# The 451st counted request exceeds the 450/minute business budget. Keep this number just above
# the nginx bucket on purpose: if the jail sits below the bucket, raising the bucket only moves
# players from a transient 444 to a permanent ban.
