# HTTP-level include; optional browser gate installation only.
map "$request_method:$http_accept:$http_upgrade" $sp_gate_navigation {
    default 0;
    ~*^GET:.*text/html.*:$ 1;
}
map $uri $sp_gate_issue_key {
    default "";
    /_gate/challenge $binary_remote_addr;
    /_gate/verify $binary_remote_addr;
}
map $uri $sp_gate_global_key { default ""; ~^/_gate/ gate; }
limit_req_zone $sp_gate_issue_key zone=sp_gate_issue:1m rate=6r/m;
limit_req_zone $sp_gate_global_key zone=sp_gate_global:1m rate=10r/s;
