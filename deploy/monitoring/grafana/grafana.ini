# Grafana for the Stronghold-Protocol server monitor (compose.monitoring.yaml mounts this read-only).
#
# Exposure: Grafana listens on 127.0.0.1 only. Nginx publishes nothing but the public-dashboard paths under /monitor/
# (/monitor/public-dashboards/, /monitor/api/public/, /monitor/public/); the admin UI is reached through an SSH tunnel.
# The compose file sets root_url (GRAFANA_ROOT_URL) and the admin password file by environment.
# No outbound calls: analytics, update checks, news, gravatar, plugin preinstall/key retrieval and external snapshots
# are off. Only the Prometheus data source plugin is loaded.

[server]
http_addr = 127.0.0.1
http_port = 3160
serve_from_sub_path = true
enforce_domain = false
enable_gzip = true
router_logging = false

[security]
admin_user = admin
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
strict_transport_security = false
x_content_type_options = true
x_xss_protection = true
allow_embedding = false
disable_brute_force_login_protection = false

[auth]
disable_login_form = false
login_maximum_inactive_lifetime_duration = 1d
login_maximum_lifetime_duration = 7d

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark
default_language = zh-Hans

[public_dashboards]
enabled = true

[live]
max_connections = 0

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
enabled = false
external_enabled = false

[plugins]
plugin_admin_enabled = false
public_key_retrieval_disabled = true
preinstall_disabled = true
# Only Prometheus is used: the other bundled data sources would each run a backend process (~25 MB each).
disable_plugins = alertmanager,cloudwatch,elasticsearch,grafana-azure-monitor-datasource,grafana-postgresql-datasource,grafana-pyroscope-datasource,grafana-testdata-datasource,graphite,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin

[unified_alerting]
enabled = false

[log]
mode = console
level = warn

[dashboards]
min_refresh_interval = 30s
