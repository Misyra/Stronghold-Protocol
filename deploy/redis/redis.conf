# deploy/redis/redis.conf — 游戏状态的存储（custom_docs/operations/PERSISTENCE.md「Redis（可选持久化）」）。
#
# 状态是「能续上最好，续不上就重开」的数据：玩家重开一局没有损失，所以这里一律偏向「不占内存、不写盘」。
# 机器小（4 核 4 GB 之类）时这些值与游戏主线程、SP_WORKERS 个模拟线程共享同一块内存。
#
# 用 Valkey 还是 Redis 都行：同一套 RESP 与命令，下面的指令两边都认。

bind 127.0.0.1
port 6379

# 只放这个游戏服的状态：键前缀由 SP_REDIS_PREFIX 决定（默认 stronghold:）。
# 一个前缀只给一个游戏服 —— 两个进程连同一个前缀会互相覆盖。
maxmemory 384mb
# 所有状态键都带 TTL（SP_REDIS_TTL，默认 25 小时），所以先淘汰最旧的检查点：
# 丢掉一个 20 小时前的对局断点，比让 Redis OOM 或者淘汰掉整份索引好。
maxmemory-policy volatile-ttl

# 不落盘：Redis 重启就当存档没了，游戏照常跑（/healthz 的 persistence 会显示它没读到）。
# 想要 Redis 自己也留一份就打开下面两行，代价是磁盘与 fork 内存。
appendonly no
save ""

# 两台机器共用一台 Redis 时把它绑到内网地址并设密码（SP_REDIS_URL=redis://:密码@内网地址:6379）。
# 单机自用保持 bind 127.0.0.1、不设密码即可。
# requirepass change-me

# 状态就是几百 KB 的 JSON，慢查询日志留着看有没有异常大的值
slowlog-log-slower-than 20000
