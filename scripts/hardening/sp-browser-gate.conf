# Include INSIDE server {}; replace its auth_request /_sp/ip-check directive with
# auth_request /_sp/gate-check; (never enable both). Keep its existing 403 -> 444 handler.
# Install sp-browser-gate-map.conf at HTTP level first.
# If a separate nginx-game-cache.conf snippet is installed, remove the two
# manifest locations below from this gate snippet to avoid duplicate locations.
error_page 401 = @sp_gate_needed;
auth_request_set $sp_gate_renew $upstream_http_x_gate_renew;
# Add: add_header Set-Cookie $sp_gate_renew always; in the protected /healthz location.

# Public resources needed to bootstrap offline preload. The browser gate cannot
# reliably validate these before the page has received its cookie; keep the
# server-level GeoIP, request-rate and connection limits in force.
location = /resource-sw.js {
    auth_request off;
    if ($request_method !~ ^(GET|HEAD)$) { return 444; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SP-Drop-Rejections 1;
    proxy_set_header Connection "";
    proxy_cache off;
}

