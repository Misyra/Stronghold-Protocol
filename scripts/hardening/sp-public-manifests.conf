# Server-level snippet for browser-gate deployments that do NOT install the shared cache
# snippet. Exactly one file must own these two locations: nginx rejects a duplicate location
# and the reload then silently keeps the old configuration.
#
#   with scripts/nginx-game-cache.conf.example  -> that file owns them (cached, needs sp_assets)
#   gate without that cache                     -> this file owns them (uncached)
#
# Both are public offline-preload bootstraps: the service worker fetches them before the page
# has a gate cookie, and with a different User-Agent, so the gate must not answer 444/401.
# The server-level GeoIP, request-rate and connection limits still apply.

location = /data/resource-manifest.json {
    auth_request off;
    if ($request_method !~ ^(GET|HEAD)$) { return 444; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SP-Drop-Rejections 1;
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_read_timeout 20s;
}

location = /assets-manifest.json {
    auth_request off;
    if ($request_method !~ ^(GET|HEAD)$) { return 444; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SP-Drop-Rejections 1;
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_read_timeout 20s;
}
