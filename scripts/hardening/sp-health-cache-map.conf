# HTTP-level include; sp_local_api_monitor comes from sp-public-api-map.conf.
map $uri $sp_health_global_key {
    default "";
    /healthz healthz;
}
# One shared bucket across IPs/hosts/queries; internal ban subrequests do not consume it.
limit_req_zone $sp_health_global_key zone=sp_health_global:1m rate=5r/s;
limit_conn_zone $sp_health_global_key zone=sp_health_conn_global:1m;
map $arg_build $sp_health_cache_variant {
    default public;
    1 build;
}
map $sp_health_cache_variant $sp_health_public_uri {
    default /healthz;
    build /healthz?build=1;
}
# Public cache fills have canonical queries: traffic/debug/random arguments cannot
# expose diagnostics, poison build-only responses or create unbounded cache keys.
map $sp_local_api_monitor $sp_health_cache_uri {
    default $sp_health_public_uri;
    1 $request_uri;
}
