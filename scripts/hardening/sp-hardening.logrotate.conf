# Install as /etc/logrotate.d/sp-hardening. Remove overlapping existing patterns first.
# maxsize is checked when logrotate runs; it is not a hard filesystem size cap.
/var/log/nginx/sp/*.log {
    daily
    maxsize 100M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        if [ -s /run/nginx.pid ]; then
            kill -USR1 "$(cat /run/nginx.pid)"
        fi
    endscript
}
