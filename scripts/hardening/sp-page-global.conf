# HTTP-level include. A constant key shares the budget across IPs, Host and query.
# Applied before auth_request so rejected homepage floods never reach browser-gate.
map $uri $sp_page_global_key {
    default "";
    / page;
    /play page;
    /index.html page;
    /build/index.html page;
}
limit_req_zone $sp_page_global_key zone=sp_page_global:1m rate=20r/s;
