# HTTP-level include. Static loads and retries do not consume the permanent-ban budget.
# Static requests have a separate rate budget; headers and Host never grant exemption.
# Applies to this game origin only. Direct CDN downloads have no request-count limit here;
# do not install this map/these zones on the art CDN. Local fallback art still uses the origin budget.
map $uri $sp_static_candidate {
    default 0;
    "~^/(?:_v/[a-f0-9]{12,64}/)?(?:build|js|css|i18n|assets|icons|fonts|media|vendor|shared|sim|data|packs|cs|vs|p)/" 1;
    "~^/(?:_v/[a-f0-9]{12,64}/)?data\.js$" 1;
    /resource-sw.js 1;
    /manifest.json 1;
    /assets-manifest.json 1;
    /favicon.ico 1;
    ~^/_gate/assets/ 1;
}
map "$sp_static_candidate:$uri" $sp_business_key {
    default $binary_remote_addr;
    ~^1: "";
    "0:/_sp/ip-check" "";
    "0:/_sp/http-drop" "";
    "0:/_sp/gate-check" "";
    # Portal probes share CGNAT exits with players: rate-limit, never count towards permanent business bans.
    "0:/api/ping" "";
}
map $sp_static_candidate $sp_static_key {
    default "";
    1 $binary_remote_addr;
}
map "$sp_static_candidate:$uri" $sp_log_business {
    default 1;
    ~^1: 0;
    "0:/api/ping" 0;
}
limit_req_zone $sp_business_key zone=sp_business:10m rate=300r/m;
limit_req_zone $sp_static_key zone=sp_static:10m rate=100r/s;
