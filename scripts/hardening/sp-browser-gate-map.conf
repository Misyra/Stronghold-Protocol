# HTTP-level include; optional browser gate installation only.
# Navigation detection must not depend on Accept alone. Every current engine sends
# Sec-Fetch-Mode: navigate for a top-level navigation, while in-app WebViews (WeChat/QQ X5,
# Android WebView before 76) legitimately send Accept: */*. Judging by Accept only returned
# 444 to those clients: a blank page, never the verification page.
# Sec-Fetch-Mode is NOT empty for script-initiated requests: fetch() sends "cors", so the
# Accept fallback has to tolerate any mode value (including none) instead of anchoring on ":".
# Upgrade is matched as empty because a WebSocket handshake must never receive the gate page.
map "$http_sec_fetch_mode:$request_method:$http_accept:$http_upgrade" $sp_gate_navigation {
    default 0;
    ~*^navigate:GET: 1;
    ~*^[^:]*:GET:.*text\/html.*:$ 1;
}
map $uri $sp_gate_issue_key {
    default "";
    /_gate/challenge $binary_remote_addr;
    /_gate/verify $binary_remote_addr;
}
map $uri $sp_gate_global_key { default ""; ~^/_gate/ gate; }
# A gate challenge legitimately repeats: cookie rejection, PO token refresh, a reload racing the
# first verify, a mobile network switch, several people behind one CGNAT address. 9r/m refused
# real browsers long before it refused abuse (one entry already costs two requests), so the
# per-source budget is per-minute and sized for a shared egress.
limit_req_zone $sp_gate_issue_key zone=sp_gate_issue:1m rate=60r/m;
limit_req_zone $sp_gate_global_key zone=sp_gate_global:1m rate=60r/s;
# Every connection to the gate service counts against this zone; it is the only place the gate
# snippet spends its own connection budget. Referenced by sp-browser-gate.conf (limit_conn).
limit_conn_zone $binary_remote_addr zone=sp_conn_ip:10m;
