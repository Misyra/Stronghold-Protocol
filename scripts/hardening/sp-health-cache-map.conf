# HTTP-level include; sp_local_api_monitor comes from sp-public-api-map.conf.
# Build polling is authenticated like health, but has its own bounded request budget.
# $uri alone drops the query and would charge every player to the bare-health bucket.
map "$uri:$arg_build" $sp_health_global_key {
    default "";
    "/healthz:1" "";
    ~^/healthz: healthz;
}
map "$uri:$arg_build" $sp_build_global_key {
    default "";
    "/healthz:1" build;
}
map $sp_build_global_key $sp_build_key {
    default "";
    build $binary_remote_addr;
}
map $uri $sp_health_conn_key {
    default "";
    /healthz healthz;
}
# One shared bucket across IPs/hosts/queries; internal ban subrequests do not consume it.
limit_req_zone $sp_health_global_key zone=sp_health_global:1m rate=9r/s;
# 1200 foreground pages poll once/minute (20/s); allow 2x average plus a bounded burst.
# Keep the original per-IP health budget; only the global build budget gains capacity.
limit_req_zone $sp_build_global_key zone=sp_build_global:1m rate=40r/s;
# The build guard runs on a 60s interval, but a reload, a focus event and a retry ladder can put
# three or four checks inside one minute from the same page. 12r/m turned that into a 444 that the
# client cannot distinguish from "server down".
limit_req_zone $sp_build_key zone=sp_build:10m rate=45r/m;
limit_conn_zone $sp_health_conn_key zone=sp_health_conn_global:1m;
map $arg_build $sp_health_cache_variant {
    default public;
    1 build;
}
map $sp_health_cache_variant $sp_health_public_uri {
    default /healthz;
    build /healthz?build=1;
}
# Public cache fills have canonical queries: traffic/debug/random arguments cannot
# expose diagnostics, poison build-only responses or create unbounded cache keys.
map $sp_local_api_monitor $sp_health_cache_uri {
    default $sp_health_public_uri;
    1 $request_uri;
}
