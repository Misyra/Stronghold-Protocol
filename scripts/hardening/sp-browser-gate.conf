# The public offline-preload manifests (/data/resource-manifest.json and /assets-manifest.json)
# are NOT defined here. nginx refuses a duplicate location, and the shared cache snippet
# already ships both with auth_request off. Install exactly one owner next to this file:
#   * with the shared cache  -> scripts/nginx-game-cache.conf.example (cached, needs sp_assets);
#   * gate without that cache -> scripts/hardening/sp-public-manifests.conf (uncached).
# Never keep both copies: `nginx -t` fails with "duplicate location" and the reload silently
# does not happen, which leaves the previous configuration serving traffic.

# Public, read-only recovery probe. It issues no challenge or admission grant on failure.
# Inherit the server's business/global limits, not the challenge issuance budget below.
location = /_gate/status {
    auth_request off;
    if ($request_method != GET) { return 444; }
    proxy_pass http://127.0.0.1:3101;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Gate-IP $remote_addr;
    proxy_set_header X-Gate-Host $http_host;
    proxy_set_header X-Gate-Scheme $scheme;
    proxy_set_header X-Gate-Original-URI $request_uri;
    proxy_set_header X-Gate-Entry "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}

location = /_sp/gate-check {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3101/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Gate-IP $remote_addr;
    proxy_set_header X-Gate-Host $http_host;
    proxy_set_header X-Gate-Scheme $scheme;
    proxy_set_header X-Gate-Original-URI $request_uri;
    proxy_set_header X-Gate-Entry "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_cache off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}
location @sp_gate_needed {
    auth_request off;
    if ($sp_gate_navigation = 0) { return 444; }
    # Serve the verification page at the requested URL: query and fragment survive.
    proxy_pass http://127.0.0.1:3101;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Gate-IP $remote_addr;
    proxy_set_header X-Gate-Host $http_host;
    proxy_set_header X-Gate-Scheme $scheme;
    proxy_set_header X-Gate-Original-URI $request_uri;
    proxy_set_header X-Gate-Entry 1;
    proxy_cache off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}
location ^~ /_gate/ {
    auth_request off;
    client_max_body_size 4k;
    client_body_timeout 5s;
    # Refusals here must be readable. The server-level status is 444 (no bytes at all), which a
    # browser reports as "Failed to fetch" on the Chinese verification page: the player cannot
    # tell a rate limit from a network fault. 429 lets entry.js say so in words.
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=sp_gate_issue burst=20 nodelay;
    limit_req zone=sp_gate_global burst=120 nodelay;
    limit_conn sp_conn_ip 16;
    proxy_pass http://127.0.0.1:3101;
    proxy_set_header X-Gate-IP $remote_addr;
    proxy_set_header X-Gate-Host $http_host;
    proxy_set_header X-Gate-Scheme $scheme;
    proxy_set_header X-Gate-Original-URI $request_uri;
    proxy_set_header X-Gate-Entry "";
    proxy_cache off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_send_timeout 3s;
}
