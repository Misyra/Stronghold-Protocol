# HTTP-level include. Nickname HTTP preflight is temporarily suspended; implementation is retained.
# Use restored $remote_addr from explicitly trusted proxies; never inspect client-supplied IP headers.
geo $sp_local_api_monitor {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
}
map $uri $sp_public_api_closed_path {
    default 0;
    # Temporary suspension (2026-10-17); re-enable together with the title-screen preflight switch.
    # /api/nickname/validate 0;
    /healthz 0;
    ~^/(healthz|metrics)(/|$) 1;
    # Public client APIs; the game server applies country and request-rate checks.
    /api/ping 0;
    /api/announcement 0;
    /api/portal-room 0;
    /api/portal-room/status 0;
    ~^/api/rooms(/|$) 0;
    # Unknown APIs remain closed; nickname validation stays paused by the catch-all and exact location.
    ~^/api(/|$) 1;
}
map "$sp_local_api_monitor:$sp_public_api_closed_path" $sp_close_public_api {
    default 0;
    "0:1" 1;
}

# Incident 2026-10-17: public latency probes need no browser cookie; room lookup keeps admission.
# Loopback monitoring and internal subrequests must not drain these public buckets.
map "$sp_local_api_monitor:$uri" $sp_ping_key {
    default "";
    "0:/api/ping" $binary_remote_addr;
}
map "$sp_local_api_monitor:$uri" $sp_rooms_key {
    default "";
    ~^0:/api/rooms(?:/|$) $binary_remote_addr;
}
limit_req_zone $sp_ping_key zone=sp_ping_ip:1m rate=60r/m;
limit_req_zone $sp_rooms_key zone=sp_rooms_ip:1m rate=30r/m;
