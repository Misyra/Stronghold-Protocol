# Install as /etc/fail2ban/filter.d/sp-ws-upgrade.conf.
# DIRECT ingress only. Count the server-generated final marker, never a query/UA substring.
# Successful sockets and upstream 5xx must not cause an ingress IP ban.
# Only actual /ws 444 refusals with the server-generated upgrade marker count.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "GET /ws(?:\?[^" ]*)? HTTP/[^" ]+" 444 \d+ .*\bws_upgrade=1$
ignoreregex =
