# 主线程调度优先级：Nice=-20（SCHED_OTHER，static priority 0）。
# 这是 systemd drop-in 片段，不是单元文件；复制到 drop-in 目录并改名使用：
#
#   sudo cp deploy/main-thread-priority.conf \
#        /etc/systemd/system/stronghold.service.d/zzzzz-main-thread-priority.conf
#   sudo systemctl daemon-reload && sudo systemctl restart stronghold
#
# 作用与边界（完整说明见 deploy/README.md 与 docs/DEPLOY.md §14）：
# - 只在 CPU 争抢时起作用。机器空闲时 nice 无感；它解决的是晚高峰页面加载海啸 / 断线风暴时
#   主线程事件循环与本机其他进程平等抢 CPU 导致的偶发 1.2–2.9 s 阻塞。不增加 CPU 配额，
#   不改变 cgroup 权重，也不是实时调度，更不替代代码层优化。
# - 对整个进程生效。Nice= 由 systemd 管理器在降权（User=stronghold）之前设置，所以负值能设上；
#   之后 Node spawn 的 worker_threads（战斗模拟线程池）在同一个进程里创建，同样继承 -20。
#   「主线程 -20、Worker 保持 0」的内部对比因此弱化，但本步的目标是「赢过本机其他进程」，
#   这一点不受影响——所以它仍是第一步（只提主线程的 helper + watcher 见 README 的第二步小节）。
# - 不改任何游戏代码与数据：golden、协议、sim 全部不动，服务照常以 stronghold 用户运行。
#
# 验证（restart 之后）：
#   ps -o pid,ni,comm -p $(pgrep -f 'server/index.js')        # NI 列应为 -20
#   ps -eLo pid,tid,ni,comm -p $(pgrep -f 'server/index.js')  # 线程级：本方案下所有线程 NI 均 -20（预期）
#
# 回滚（下次重启回到默认 Nice=0）：
#   sudo rm /etc/systemd/system/stronghold.service.d/zzzzz-main-thread-priority.conf
#   sudo systemctl daemon-reload && sudo systemctl restart stronghold
[Service]
Nice=-20
